# ==============================================================================
# SitePulse — Render Infrastructure as Code Blueprint (render.yaml)
# Orchestrates:
#   1. Express Backend Web Service (Node.js serves both API & Frontend SPA)
#   2. FastAPI ML Inference Microservice (Python 3.12 with Scikit-Learn)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Machine Learning Inference Microservice (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: sitepulse-ml-service
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/ml_service/requirements.txt
    startCommand: python -m uvicorn backend.ml_service.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: MODEL_DIR
        value: model

  # ----------------------------------------------------------------------------
  # 2. Core Express Backend API & Frontend SPA (Node.js)
  # ----------------------------------------------------------------------------
  - type: web
    name: sitepulse-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: node backend/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_AUTH
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: ML_PREDICTION_TIMEOUT_MS
        value: "10000"
      - key: LLM_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        sync: false
